[project]
site_name = "GSWA Supermodel"
site_url = "https://geological-survey-of-western-australia.github.io/GSWA-Supermodel/"
extra_css = ["stylesheets/extra.css"]
nav = [
    "index.md",
    { "Foreground Models" = [
        "foreground.md",
        { "GeoFeatures Hierarchy" = "foreground/geofh.md" },
        { "Bore" = "foreground/bore.md" },
        { "Mine" = "foreground/mine.md" },
        { "Mining Authorisation" = "foreground/mining-authorisation.md" },
        { "Geosample" = "foreground/geosample.md" },
        { "Resource Occurrence" = "foreground/resource-occurrence.md" },
    ] },
    "background.md",
    { "Component Models" = [
        "components/index.md",
    ] },
    "vocabularies.md",
    "pids.md",
]

[project.extra]
generator = false

[project.theme]
variant = "classic"
favicon = "assets/favicon.png"
custom_dir = "overrides"
features = ["navigation.indexes", "toc.follow"]

[project.theme.palette]
scheme = "youtube"

[project.markdown_extensions]
md_in_html = {}
admonition = {}
attr_list = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
