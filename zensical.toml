[project]
site_name = "GSWA Supermodel"
site_url = "https://geological-survey-of-western-australia.github.io/GSWA-Supermodel/"
copyright = "Copyright &copy; Government of Western Australia (Department of Mines, Industry Regulation and Safety), 2022"
extra_css = ["stylesheets/extra.css"]
nav = [
    "index.md",
    "background.md",
    "backbone.md",
    { "Component Models" = [
        "components/index.md",
        { "GeoFeatures Hierarchy" = "components/geofh.md" },
        { "Bore" = "components/bore.md" },
        { "Mine" = "components/mine.md" },
        { "Mining Authorisation" = "components/mining-authorisation.md" },
        { "Resource Occurrence" = "components/resource-occurrence.md" },
        { "Geosample" = "components/geosample.md" },
    ] },
    "vocabularies.md",
    "pids.md",
]

[project.extra]
generator = false

[project.theme]
variant = "classic"
favicon = "assets/favicon.png"
logo = "assets/classes-icon.svg"
features = ["navigation.indexes", "toc.follow"]

[project.theme.palette]
scheme = "youtube"

[project.markdown_extensions]
md_in_html = {}
admonition = {}
attr_list = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
